<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="../styles.css">
    <title>Choose an Option - DMAP</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(12px, 2vw, 28px);
        min-height: 100vh;
        min-height: 100dvh;
        padding: clamp(16px, 3vw, 42px);
      }
      .action {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
        padding: 1.5rem;
        border: 4px solid rgba(255, 255, 255, 0.5);
        border-radius: 26px;
        color: #000000;
        font-size: clamp(2rem, 5vw, 5rem);
        font-weight: 700;
        line-height: 1.1;
        text-align: center;
        text-decoration: none;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2);
        transition: transform 120ms ease, filter 120ms ease;
      }
      .reserve { background: #e6fff1; }
      .register { background: #ffebe3; }
      .action:focus-visible { outline: 6px solid #ffd55c; outline-offset: 4px; }
      .action:hover, .action:active { filter: brightness(1.12); transform: scale(0.985); }
      @media (max-width: 640px) {
        main { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main aria-label="Deer management actions">
      <a class="action reserve" href="../Hunter/hunter.html">Reserve<br>a Hunting<br>Spot</a>
      <a class="action register" href="../Checkout/checkout.html">Clock Out<br>and Register<br>Caught<br>Deer</a>
    </main>
  </body>
</html>
