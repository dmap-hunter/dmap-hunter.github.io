<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="../styles.css">
    <link rel="stylesheet" type="text/css" href="checkout.css">
    <title>Hunter Checkout - DMAP</title>
    <script src="../hunterLoggedIn.js"></script>
</head>
<body>

    <center>

        <h3>Adult Bucks caught today: </h3>
        <input placeholder="Adult Bucks" id="bucks" type="range" min="0" max="5" value="0" step="1" />
        <div class="tick-labels" aria-hidden="true">
            <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
        </div>

        <h3>Button Bucks caught today:</h3>
        <input placeholder="Buttons" id="buttons" type="range" min="0" max="5" value="0" step="1" />
        <div class="tick-labels" aria-hidden="true">
            <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
        </div>

        <h3>Does caught today:</h3>
        <input placeholder="Does" id="does" type="range" min="0" max="5" value="0" step="1" />
        <div class="tick-labels" aria-hidden="true">
            <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
        </div>

        <h3>Hours hunted today:</h3>
        <input placeholder="Hours" id="hours" type="range" min="0" max="15" value="0" step="1" />
        <div class="tick-labels" aria-hidden="true">
            <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
        </div>

        <button id="submit">Submit</button>
        <button id="goback">Go Back</button>
        <br><br>

    </center>
      

    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-auth-compat.js"></script>

    <script src="../Firebase/firebase.js"></script>
    <script src="script.js"></script>

</body>
</html>
