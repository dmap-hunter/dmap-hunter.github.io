<head>

    <link rel="stylesheet" type="text/css" href="../styles.css">
    <link rel="stylesheet" type="text/css" href="HunterLogin.css">
    <title>Hunter Login - DMAP</title>
</head>
<body>

    <center>

        <h1>Login</h1>

        <h3>Two-digit Hunter ID:</h3>
        <select title="num" id="hunterNumber"></select>

        <select title="letter" id="hunterInitial"></select>
        <br>

        <button id="submitID">Submit</button>
        <br><br>

    </center>

    <script src="script.js"></script>

</body>
</html>
